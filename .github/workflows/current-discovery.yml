name: Refresh current PubMed metadata
on:
  schedule:
    # Before 2 AM Pacific across DST. Two small refreshes, four replaceable rows.
    - cron: '11 8,9 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: em-weekly-current-discovery
  cancel-in-progress: false
jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-db.txt
      - run: pip install -r requirements-db.txt
      - run: python3 -m unittest discover -s tests -p '*_test.py'
      - name: Refresh bounded official metadata, preserving the previous cache on failure
        env:
          EM_WEEKLY_DATABASE_URL: ${{ secrets.EM_WEEKLY_DATABASE_URL }}
        run: python3 scripts/current-discovery.py
