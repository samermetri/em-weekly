name: Refresh PubMed discovery index
on:
  workflow_dispatch:
    inputs:
      window:
        description: 'Optional seven-day window start (YYYY-MM-DD); empty refreshes the fixed two-year range'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: em-weekly-publication
  cancel-in-progress: false
jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Retrieve official discovery metadata (no AI or database writes)
        env:
          INDEX_WINDOW: ${{ inputs.window }}
        run: pnpm discover:backfill
      - run: pnpm validate
      - name: Commit the complete metadata snapshot
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state/research-index
          if ! git diff --cached --quiet; then
            git commit -m 'research: refresh PubMed candidate index [skip ci]'
            git push origin HEAD:main
          fi
      - name: Validate and publish the refreshed static index
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh api --method POST "repos/$GH_REPO/actions/workflows/publish.yml/dispatches" -f ref=main
